[package]
name = "cofe-graph"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp              = { version = "1.7.0", features = ["server", "macros", "transport-io", "schemars"] }
tree-sitter       = "0.26.9"
tree-sitter-c     = "0.24.2"
streaming-iterator = "0.1.9"
tokio             = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
walkdir           = "2"
anyhow            = "1"
