<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>cofe-graph</title>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
    integrity="sha256-V7N9fK6aJ9ll/a5K3MhEJF39xAfmVa7oXc//OggDaj8=" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
    }

    body {
      font-family: monospace;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: var(--bg);
      color: var(--fg);
    }

    h2 {
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: .5rem;
      font-size: 1rem;
      font-family: monospace;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .result {
      cursor: pointer;
      padding: .3rem .5rem;
      border-bottom: 1px solid #eee;
    }

    .result:hover {
      background: #f5f5f5;
    }

    .file {
      color: #888;
      font-size: .85em;
      margin-left: .5rem;
    }

    .source-header {
      margin-top: 1.5rem;
      margin-bottom: .25rem;
    }

    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 1rem;
      overflow-x: auto;
      border-radius: 4px;
      margin: 0;
    }

    .error {
      color: #c00;
      margin-top: .5rem;
    }
  </style>
</head>

<body x-data="app()">
  <h2>cofe-graph</h2>
  <input type="search" placeholder="Search functions…" x-model="q" @input.debounce.300ms="search()">
  <div class="error" x-show="error" x-text="error"></div>
  <div style="margin-top:.5rem">
    <template x-for="fn in results" :key="fn.name">
      <div class="result" @click="showSource(fn.name)">
        <strong x-text="fn.name"></strong>
        <span class="file" x-text="fn.file + ':' + fn.line"></span>
      </div>
    </template>
  </div>
  <template x-if="source">
    <div>
      <div class="source-header">
        <strong x-text="selectedName"></strong>
        <span class="file" x-text="source.file + ':' + source.line"></span>
      </div>
      <pre x-text="source.source"></pre>
    </div>
  </template>
  <script>
    function app() {
      return {
        q: '', results: [], source: null, selectedName: '', error: '',
        async search() {
          this.source = null; this.error = '';
          if (!this.q.trim()) { this.results = []; return; }
          const r = await fetch('/api/search?q=' + encodeURIComponent(this.q));
          const d = await r.json();
          if (d.error) { this.error = d.error; this.results = []; }
          else { this.results = d; this.error = ''; }
        },
        async showSource(name) {
          this.selectedName = name; this.source = null;
          const r = await fetch('/api/source?name=' + encodeURIComponent(name));
          const d = await r.json();
          if (d.error) { this.error = d.error; }
          else { this.source = d; this.error = ''; }
        },
      }
    }
  </script>
</body>

</html>
